<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bikram Parajuli</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f7f7f7;
            color: #222;
        }
        header {

        .teaching-item {

        }

        }

        .profile-text p {

        header p {

            font-size: 1.3rem;

        .profile-intro {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #333;

        }
        .edu-item {
            margin-bottom: 18px;
            line-height: 1.5;
        }
        
        .edu-desc {
            color: #444;
            font-size: 1.1rem;
        }
        .award-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .award-list-item {
            position: relative;
            padding-left: 20px;
            margin-bottom: 18px;
            line-height: 1.55;
        }

        .award-list-item::before {
            content: '';
            position: absolute;
            left: 2px;
            top: 9px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #0c2340;
            opacity: 0.55;
        }

        .award-title {
            font-weight: 700;
            color: #222;
            font-size: 0.98rem;
        }

        .award-year {
            color: #888;
            font-size: 0.87rem;
            margin-left: 6px;
        }

        .award-desc {
            color: #666;
            font-size: 0.89rem;
            font-style: italic;
            margin-top: 3px;
        }

        .vol-item {
            margin-bottom: 30px;
            line-height: 1.5;
            font-size: 0.97rem;
        }
        .vol-image img {
            width: 100%;
            max-height: 420px;
            border-radius: 8px;
            box-shadow: 0 0 8px rgba(0,0,0,0.12);
            object-fit: cover;
            margin-bottom: 12px;
            display: block;
        }

        html {
            scroll-behavior: smooth;
        }

        nav {
            background: #12284a;
            padding: 0 4%;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        nav a {
            color: #ddd;
            text-decoration: none;
            padding: 15px 21px;
            font-size: 1.4rem;
        }
        nav a:hover {
            background: #1f3b70;
            color: #fff;
        }
        nav a.active {
            background: #1f3b70;
            color: #fff;
        }

        main {
            max-width: 1400px;
            margin: 25px auto 40px;
            padding: 0 3%;
        }

        #content {
            background: #fff;
            border-radius: 6px;
            padding: 24px 22px 30px;
            box-shadow: 0 0 8px rgba(0,0,0,0.06);
            min-height: 200px;
        }

        .page-section {
            scroll-margin-top: 75px;
        }

        .page-section + .page-section {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        h2 {
            margin-top: 0;
            border-bottom: 2px solid #eee;
            padding-bottom: 6px;
        }

        .profile-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            text-align: center;
        }
        .profile-photo img {
            width: 230px;
            height: 280px;
            border-radius: 8px;
            object-fit: cover;
            box-shadow: 0 0 6px rgba(0,0,0,0.15);
        }
        .profile-text {
            max-width: 680px;
            margin: 0 auto;
        }
        .contact-line {
            margin-top: 10px;
            font-size: 0.95rem;
            color: #444;
        }
        .contact-line a {
            color: #0066cc;
            text-decoration: none;
        }
        .contact-line a:hover {
            text-decoration: underline;
        }
        .cv-button {
            display: inline-block;
            margin-top: 18px;
            padding: 10px 24px;
            background: #0c2340;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 0 5px rgba(0,0,0,0.15);
        }

        .cv-button:hover {
            background: #1f3b70;
        }

        h3 {
            color: #0c2340;
            margin-top: 6px;
        }

        .pub-card {
            background: #fafafa;
            border: 1px solid #eaeaea;
            border-left: 4px solid #0c2340;
            border-radius: 8px;
            padding: 18px 20px;
            margin-bottom: 20px;
            box-shadow: 0 0 6px rgba(0,0,0,0.05);
        }

        .pub-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #0c2340;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .pub-meta {
            font-size: 0.93rem;
            color: #444;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .pub-meta em {
            color: #333;
        }

        .pub-abstract {
            font-size: 0.93rem;
            color: #333;
            line-height: 1.6;
            margin: 0 0 14px;
        }

        .pub-link {
            display: inline-block;
            font-size: 0.9rem;
            font-weight: 700;
            color: #0066cc;
            text-decoration: none;
        }

        .pub-link:hover {
            text-decoration: underline;
        }

        .presentation-item {
            background: #fafafa;
            border: 1px solid #eaeaea;
            border-left: 4px solid #0e7c86;
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 14px;
            flex-wrap: wrap;
        }

        .presentation-text {
            flex: 1 1 380px;
            font-size: 0.95rem;
            line-height: 1.55;
            color: #333;
        }

        .presentation-text strong {
            color: #0c2340;
        }

        .type-badge {
            display: inline-block;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .type-badge.presentation {
            background: #0c2340;
        }

        .type-badge.poster {
            background: #0e7c86;
        }

        .type-badge.instructor {
            background: #0c2340;
        }

        .type-badge.ta {
            background: #0c2340;
        }

        .skill-category-label {
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            color: #888;
            margin: 26px 0 12px;
        }

        .skill-category-label:first-of-type {
            margin-top: 4px;
        }

        .skill-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 4px;
        }

        .skill-tag {
            display: inline-block;
            background: #eaf1fb;
            color: #0c2340;
            border: 1px solid #d7e4f5;
            border-radius: 20px;
            padding: 7px 16px;
            font-size: 0.88rem;
            font-weight: 600;
        }

        .teaching-card {
            background: #fafafa;
            border: 1px solid #eaeaea;
            border-left: 4px solid #0c2340;
            border-radius: 8px;
            padding: 18px 20px;
            margin-bottom: 18px;
            box-shadow: 0 0 6px rgba(0,0,0,0.05);
        }

        .teaching-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }

        .teaching-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #0c2340;
            line-height: 1.4;
        }

        .teaching-meta {
            font-size: 0.92rem;
            color: #444;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .teaching-desc {
            font-size: 0.93rem;
            color: #333;
            line-height: 1.6;
            margin: 0 0 10px;
        }

        .teaching-term {
            font-size: 0.88rem;
            color: #0e7c86;
            font-weight: 700;
        }

        .contact-item {
            background: #fafafa;
            border: 1px solid #eaeaea;
            border-left: 4px solid #0c2340;
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 14px;
            line-height: 1.5;
            font-size: 0.97rem;
        }

        .contact-item strong {
            display: block;
            color: #0c2340;
            margin-bottom: 4px;
            font-size: 1rem;
        }

        .contact-item a {
            color: #0066cc;
            text-decoration: none;
        }

        .contact-item a:hover {
            text-decoration: underline;
        }

        @media (max-width: 700px) {
            header, nav {
                padding: 12px 5%;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Bikram Parajuli</h1>
        <p>PhD Candidate · Geography &amp; Environmental Sustainability · Spatial Optimization · Remote Sensing · GeoAI</p>
    </header>

    <nav>
        <a href="#profile" id="link-profile">Profile</a>
        <a href="#education" id="link-education">Education</a>
        <a href="#skills" id="link-skills">Skills</a>
        <a href="#publications" id="link-publications">Publications</a>
        <a href="#teaching" id="link-teaching">Teaching</a>
        <a href="#awards" id="link-awards">Awards</a>
        <a href="#community" id="link-community">Community Service</a>
        <a href="#contact" id="link-contact">Contact</a>
    </nav>

    <main>
        <div id="content">
            Loading...
        </div>
    </main>

    <script>
        const sectionFiles = {
            profile: 'profile.html',
            education: 'education.html',
            skills: 'skills.html',
            publications: 'publications.html',
            teaching: 'teaching.html',
            awards: 'awards.html',
            community: 'community.html',
            contact: 'contact.html'
        };

        var sectionOrder = ['profile', 'education', 'skills', 'publications', 'teaching', 'awards', 'community', 'contact'];

        function setActiveLink(section) {
            document.querySelectorAll('nav a').forEach(function (a) {
                a.classList.remove('active');
            });
            var link = document.getElementById('link-' + section);
            if (link) {
                link.classList.add('active');
            }
        }

        function setupScrollSpy() {
            var sections = document.querySelectorAll('.page-section');
            var observer = new IntersectionObserver(function (entries) {
                entries.forEach(function (entry) {
                    if (entry.isIntersecting) {
                        setActiveLink(entry.target.id);
                    }
                });
            }, { rootMargin: '-45% 0px -50% 0px', threshold: 0 });

            sections.forEach(function (s) {
                observer.observe(s);
            });
        }

        function scrollToInitialHash() {
            if (location.hash) {
                var el = document.getElementById(location.hash.substring(1));
                if (el) {
                    setTimeout(function () {
                        el.scrollIntoView();
                    }, 50);
                }
            }
        }

        function loadAllSections() {
            var contentDiv = document.getElementById('content');

            Promise.all(sectionOrder.map(function (key) {
                return fetch(sectionFiles[key], { cache: 'no-store' })
                    .then(function (response) {
                        if (!response.ok) {
                            throw new Error('Failed to load');
                        }
                        return response.text();
                    })
                    .catch(function () {
                        return '<p>Could not load this section.</p>';
                    });
            })).then(function (htmlPieces) {
                contentDiv.innerHTML = '';
                sectionOrder.forEach(function (key, i) {
                    var section = document.createElement('section');
                    section.id = key;
                    section.className = 'page-section';
                    section.innerHTML = htmlPieces[i];
                    contentDiv.appendChild(section);
                });
                setupScrollSpy();
                scrollToInitialHash();
            });
        }

        window.addEventListener('DOMContentLoaded', loadAllSections);
    </script>

</body>
</html>
