<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bikram Parajuli</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f7f7f7;
            color: #222;
        }
        header {
            background: #0c2340;
            color: #fff;
            padding: 18px 10%;
        }
        header h1 {
            margin: 0;
            font-size: 1.8rem;
        }
        .teaching-item {
            margin-bottom: 14px;
            line-height: 1.5;
            font-size: 0.97rem;
        }
        .profile-contact-mini {
            margin-top: 10px;
            font-size: 0.90rem;
            color: #444;
            line-height: 1.4;
            text-align: left;
        }
        
        .profile-contact-mini a {
            color: #0066cc;
            text-decoration: none;
        }
        
        .profile-contact-mini a:hover {
            text-decoration: underline;
        }
        .profile-text p {
            font-size: 1.1rem;
            line-height: 1.55;
            color: #333;
            margin-bottom: 16px;
        }


        header p {
            margin: 4px 0 0;
            font-size: 0.95rem;
            opacity: 0.9;
        }
        .profile-intro {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #333;
            margin-bottom: 18px;
        }
        .edu-item {
            margin-bottom: 18px;
            line-height: 1.5;
        }
        
        .edu-desc {
            color: #444;
            font-size: 1.1rem;
        }
        .award-item {
            margin-bottom: 26px;
            line-height: 1.5;
            font-size: 0.97rem;
            position: relative;
            min-height: 90px;
        }
                
        .award-image img {
            width: 140px;       /* Adjust image size here */
            border-radius: 6px;
            box-shadow: 0 0 6px rgba(0,0,0,0.15);
            object-fit: cover;
        }

        .vol-item {
            margin-bottom: 22px;
            line-height: 1.5;
            font-size: 0.97rem;
            position: relative;
            min-height: 90px;
        }
        .vol-image img {
            width: 140px;
            border-radius: 6px;
            box-shadow: 0 0 6px rgba(0,0,0,0.15);
            object-fit: cover;
        }

        html {
            scroll-behavior: smooth;
        }

        nav {
            background: #12284a;
            padding: 0 10%;
            display: flex;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        nav a {
            color: #ddd;
            text-decoration: none;
            padding: 10px 14px;
            font-size: 0.95rem;
        }
        nav a:hover {
            background: #1f3b70;
            color: #fff;
        }
        nav a.active {
            background: #1f3b70;
            color: #fff;
        }

        main {
            max-width: 1000px;
            margin: 25px auto 40px;
            padding: 0 5%;
        }

        #content {
            background: #fff;
            border-radius: 6px;
            padding: 24px 22px 30px;
            box-shadow: 0 0 8px rgba(0,0,0,0.06);
            min-height: 200px;
        }

        .page-section {
            scroll-margin-top: 56px;
        }

        .page-section + .page-section {
            margin-top: 40px;
            padding-top: 32px;
            border-top: 1px solid #eee;
        }

        h2 {
            margin-top: 0;
            border-bottom: 2px solid #eee;
            padding-bottom: 6px;
        }

        .profile-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .profile-photo {
            flex: 0 0 180px;
        }
        .profile-photo img {
            max-width: 180px;
            border-radius: 50%;
            object-fit: cover;
        }
        .profile-text {
            flex: 1 1 250px;
        }
        .contact-line {
            margin-top: 10px;
            font-size: 0.95rem;
            color: #444;
        }
        .contact-line a {
            color: #0066cc;
            text-decoration: none;
        }
        .contact-line a:hover {
            text-decoration: underline;
        }
        .cv-button {
            display: block;
            margin-top: 12px;
            padding: 8px 14px;
            background: #0c2340;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            font-size: 0.9rem;
            text-decoration: none;
            width: 130px;
            box-shadow: 0 0 5px rgba(0,0,0,0.15);
        }

        .cv-button:hover {
            background: #1f3b70;
        }

        .contact-item {
    margin-bottom: 16px;
    line-height: 1.5;
    font-size: 0.97rem;
        }
        
        .contact-item a {
            color: #0066cc;
            text-decoration: none;
        }
        
        .contact-item a:hover {
            text-decoration: underline;
        }

        @media (max-width: 700px) {
            header, nav {
                padding: 12px 5%;
            }
            .profile-wrapper {
                flex-direction: column;
                align-items: center;
            }
            .profile-text {
                text-align: left;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Bikram Parajuli</h1>
        <p>PhD Candidate · Geography &amp; Environmental Sustainability · Spatial Optimization · Remote Sensing · GeoAI</p>
    </header>

    <nav>
        <a href="#profile" id="link-profile">Profile</a>
        <a href="#publications" id="link-publications">Publications</a>
        <a href="#teaching" id="link-teaching">Teaching</a>
        <a href="#awards" id="link-awards">Awards</a>
        <a href="#community" id="link-community">Community Service</a>
        <a href="#contact" id="link-contact">Contact</a>
    </nav>

    <main>
        <div id="content">
            Loading...
        </div>
    </main>

    <script>
        const sectionFiles = {
            profile: 'profile.html',
            publications: 'publications.html',
            teaching: 'teaching.html',
            awards: 'awards.html',
            community: 'community.html',
            contact: 'contact.html'
        };

        var sectionOrder = ['profile', 'publications', 'teaching', 'awards', 'community', 'contact'];

        function setActiveLink(section) {
            document.querySelectorAll('nav a').forEach(function (a) {
                a.classList.remove('active');
            });
            var link = document.getElementById('link-' + section);
            if (link) {
                link.classList.add('active');
            }
        }

        function setupScrollSpy() {
            var sections = document.querySelectorAll('.page-section');
            var observer = new IntersectionObserver(function (entries) {
                entries.forEach(function (entry) {
                    if (entry.isIntersecting) {
                        setActiveLink(entry.target.id);
                    }
                });
            }, { rootMargin: '-45% 0px -50% 0px', threshold: 0 });

            sections.forEach(function (s) {
                observer.observe(s);
            });
        }

        function scrollToInitialHash() {
            if (location.hash) {
                var el = document.getElementById(location.hash.substring(1));
                if (el) {
                    setTimeout(function () {
                        el.scrollIntoView();
                    }, 50);
                }
            }
        }

        function loadAllSections() {
            var contentDiv = document.getElementById('content');

            Promise.all(sectionOrder.map(function (key) {
                return fetch(sectionFiles[key])
                    .then(function (response) {
                        if (!response.ok) {
                            throw new Error('Failed to load');
                        }
                        return response.text();
                    })
                    .catch(function () {
                        return '<p>Could not load this section.</p>';
                    });
            })).then(function (htmlPieces) {
                contentDiv.innerHTML = '';
                sectionOrder.forEach(function (key, i) {
                    var section = document.createElement('section');
                    section.id = key;
                    section.className = 'page-section';
                    section.innerHTML = htmlPieces[i];
                    contentDiv.appendChild(section);
                });
                setupScrollSpy();
                scrollToInitialHash();
            });
        }

        window.addEventListener('DOMContentLoaded', loadAllSections);
    </script>

</body>
</html>
